# ============================================================
# application.properties - Spring Boot Configuration (MongoDB)
# ============================================================

# ----- Server Port -----
server.port=8081

# ----- MongoDB Configuration -----
# Replace YOUR_DATABASE_NAME, YOUR_USERNAME, YOUR_PASSWORD if you set auth.
# For a local MongoDB with NO authentication (default for beginners):
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=leave_management

# If your MongoDB has a username & password, use this format instead:
# spring.data.mongodb.uri=mongodb://YOUR_USERNAME:YOUR_PASSWORD@localhost:27017/leave_management

# ----- Thymeleaf Settings -----
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ----- Static Resources -----
spring.web.resources.static-locations=classpath:/static/
